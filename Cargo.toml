[package]
name = "rustshot"
version = "0.1.0"
edition = "2021"

[features]
default = ["portal", "drm", "fbdev"]
# Desktop Wayland/X11 via xdg-desktop-portal. Pulls in D-Bus (pure Rust).
portal = ["dep:zbus"]
# Direct KMS scanout read. Syscalls only.
drm = []
# Legacy /dev/fb0. Syscalls only.
fbdev = []

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
libc = "0.2"
zbus = { version = "5.18.0", optional = true }

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

# Lint levels for the crate. `cargo clippy` and `cargo build` both honour these,
# so a contributor gets the same answer as CI without passing any flags.
# Tuning for individual lints lives in clippy.toml.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# This crate talks to the kernel through ioctl structs whose field widths are
# the ABI. Narrowing to the width the kernel declared is the correct move there,
# not an accident, and the checked cases already go through `try_from` or
# `checked_*`. Blanket-allowed so the signal from the rest of pedantic survives.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

# FFI structs mirror kernel field names verbatim; renaming them to satisfy the
# lint would break the correspondence a reader needs to check against headers.
struct_field_names = "allow"
