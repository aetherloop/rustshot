[package]
name = "rustshot"
version = "0.1.0"
edition = "2021"

[features]
default = ["portal", "drm", "fbdev"]
# Desktop Wayland/X11 via xdg-desktop-portal. Pulls in D-Bus (pure Rust).
portal = ["dep:zbus"]
# Direct KMS scanout read. Syscalls only.
drm = []
# Legacy /dev/fb0. Syscalls only.
fbdev = []

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
libc = "0.2"
zbus = { version = "5.18.0", optional = true }

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
